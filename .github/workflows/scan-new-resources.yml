name: Scan for New AI Safety Opportunities

on:
  schedule:
    # Every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions UI

permissions:
  issues: write
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scanner.py

      - name: Create GitHub Issue with results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python create_issue.py

      - name: Persist the seen-candidate memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_candidates.json
          # Without committing this, every run starts with no memory and the
          # weekly issue re-lists everything it has ever found.
          if git diff --cached --quiet; then
            echo "no new candidates recorded"; exit 0
          fi
          git commit -m "Record candidates surfaced by the scanner ($(date -u +'%Y-%m-%d'))"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push seen_candidates.json after 3 attempts"; exit 1

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: suggested_additions.json
          retention-days: 30
